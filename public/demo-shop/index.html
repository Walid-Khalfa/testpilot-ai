<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Demo Shop — Checkout (INTENTIONAL DEFECT)</title>
<style>
body{font-family:system-ui,sans-serif;max-width:600px;margin:2rem auto;padding:0 1rem}
h1{color:#1a1a1a}
label{display:block;margin:.75rem 0 .25rem;font-weight:600}
input{width:100%;padding:.5rem;border:1px solid #ccc;border-radius:.25rem;box-sizing:border-box}
button{margin-top:1rem;padding:.6rem 1.2rem;background:#2563eb;color:#fff;border:none;border-radius:.25rem;cursor:pointer}
.note{background:#fff3cd;padding:.75rem;border-radius:.25rem;margin-top:1rem;font-size:.85rem}
</style>
</head>
<body>
<h1>Demo Shop — Checkout</h1>
<p>This page contains an intentionally introduced defect for TestPilot AI demonstration.</p>
<form id="checkout-form" novalidate>
  <label for="name">Full name</label>
  <input id="name" name="name" type="text" required />
  <label for="email">Email</label>
  <input id="email" name="email" type="email" required />
  <label for="address">Shipping address</label>
  <input id="address" name="address" type="text" required />
  <button id="submit-order" type="submit">Place order</button>
</form>
<div id="confirmation" class="note" style="display:none">Order confirmed — thank you!</div>
<script>
// INTENTIONAL DEFECT: submit handler prevents default and never displays confirmation.
document.getElementById('checkout-form').addEventListener('submit', function (e) {
  e.preventDefault();
  // Bug: validation passes but confirmation is never shown.
  console.log('Order submitted (defect: no confirmation shown)');
});
</script>
</body>
</html>
